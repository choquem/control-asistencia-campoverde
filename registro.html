<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="container">
        <div id="navbar"></div>

        <div class="card">
            <h2>✅ Registrar Asistencia</h2>
            <div id="loadingStudents" class="loading">Cargando lista de alumnos...</div>
            
            <div id="registrationPanel" style="display: none;">
                <div class="teacher-filters" id="teacherFilters">
                    <label>👨‍🏫 Filtrar por:</label>
                    <button class="filter-btn active" onclick="filterByTeacher('todos')"> Todos</button>
                </div>
                    <!-- ✅ NUEVOS: Filtros por color de asistencia -->
                <div class="teacher-filters" style="margin-top: 15px;">
                    <label>🎨 Filtrar por asistencia:</label>
                    <button class="filter-btn color-filter-btn active" data-color="todos" onclick="filterByAttendanceColor('todos')">
                        📋 Todos
                    </button>
                    <button class="filter-btn color-filter-btn" data-color="verde" onclick="filterByAttendanceColor('verde')" style="background: #28a745; color: white; border-color: #28a745;">
                        ✅ ≥75%
                    </button>
                    <button class="filter-btn color-filter-btn" data-color="amarillo" onclick="filterByAttendanceColor('amarillo')" style="background: #ffc107; color: #212529; border-color: #ffc107;">
                        ️ 50-74%
                    </button>
                    <button class="filter-btn color-filter-btn" data-color="rojo" onclick="filterByAttendanceColor('rojo')" style="background: #dc3545; color: white; border-color: #dc3545;">
                        ❌ <50%
                    </button>
                </div>
                
                <div class="date-display">
                    <div>
                        <label for="fecha">Fecha:</label>
                        <input type="date" id="fecha">
                    </div>
                    <div class="current-date" id="currentDate"></div>
                    <div class="student-count" id="studentCount"></div>
                </div>
                <div id="attendanceTable"></div>
                <button class="btn btn-success" id="btnSave" onclick="saveAttendance()">💾 Guardar en Google Sheets</button>
                <div id="saveMessage" style="margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
