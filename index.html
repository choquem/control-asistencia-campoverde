<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Control de Asistencia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
        }
        h1 { text-align: center; color: #667eea; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #667eea; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #667eea; }
        .btn {
            width: 100%;
            padding: 12px;
            background: #00b894;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: #00a383; }
        .error { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-top: 15px; }
        .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-top: 15px; }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .info code { background: #e0e0e0; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1> Login</h1>
        
        <div class="form-group">
            <label>Usuario:</label>
            <input type="text" id="username" placeholder="admin o invitado">
        </div>
        
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" id="password" placeholder="Contraseña">
        </div>
        
        <button class="btn" onclick="login()">Ingresar</button>
        
        <div id="message"></div>
        
    
    </div>

    <script>
        console.log('🔍 Script cargado correctamente');
        
        // Usuarios
        const USERS = {
            admin: { user: 'admin', pass: 'campoverde', role: 'admin' },
            invitado: { user: 'invitado', pass: 'invitado', role: 'invitado' }
        };

        function login() {
            console.log('🔑 Intentando login...');
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const msgDiv = document.getElementById('message');
            
            if (!user || !pass) {
                msgDiv.innerHTML = '<div class="error">⚠️ Completa usuario y contraseña</div>';
                return;
            }
            
            console.log('Usuario:', user);
            
            const userData = USERS[user];
            
            if (!userData) {
                msgDiv.innerHTML = '<div class="error">❌ Usuario no existe</div>';
                console.log('❌ Usuario no encontrado');
                return;
            }
            
            if (userData.pass !== pass) {
                msgDiv.innerHTML = '<div class="error">❌ Contraseña incorrecta</div>';
                console.log(' Contraseña incorrecta');
                return;
            }
            
            // Guardar sesión
            localStorage.setItem('authSession', JSON.stringify({
                username: userData.user,
                role: userData.role,
                loginTime: new Date().toISOString()
            }));
            
            console.log('✅ Login exitoso. Rol:', userData.role);
            msgDiv.innerHTML = '<div class="success">✅ Login exitoso. Redirigiendo...</div>';
            
            // Redirigir
            setTimeout(() => {
                const nextPage = userData.role === 'admin' ? 'registro.html' : 'reporte.html';
                console.log(' Redirigiendo a:', nextPage);
                window.location.href = nextPage;
            }, 1000);
        }

        // Enter key
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
