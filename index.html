<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
        }
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            margin-bottom: 100px;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .tagline {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 35px;
            background: white;
            color: #764ba2;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-right: 15px;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .card h3 {
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        @media (max-width: 768px) {
            .hero, .cards {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <div>
                <h1>Creamos el futuro digital</h1>
                <p class="tagline">Transformamos ideas en experiencias digitales extraordinarias</p>
                <a href="#" class="btn">Empezar</a>
                <a href="#" class="btn btn-outline">Saber más</a>
            </div>
            <div style="background: rgba(255,255,255,0.1); height: 400px; border-radius: 20px;"></div>
        </div>
        
        <div class="cards">
            <div class="card">
                <h3> Rápido</h3>
                <p>Optimización máxima para el mejor rendimiento</p>
            </div>
            <div class="card">
                <h3>🎯 Efectivo</h3>
                <p>Soluciones que generan resultados reales</p>
            </div>
            <div class="card">
                <h3>💡 Innovador</h3>
                <p>Tecnología de punta para tu proyecto</p>
            </div>
        </div>
    </div>
</body>
</html>
