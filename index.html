<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-danger {
            background: #e74c3c;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status-presente {
            background: #d4edda;
            color: #155724;
        }
        .status-ausente {
            background: #f8d7da;
            color: #721c24;
        }
        .status-tardanza {
            background: #fff3cd;
            color: #856404;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transition: width 0.5s;
        }
        .week-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .week-btn {
            padding: 10px 20px;
            background: #f0f0f0;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .week-btn.active {
            background: #667eea;
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .card { padding: 20px; }
            table { font-size: 0.9rem; }
            th, td { padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Control de Asistencia</h1>
        
        <!-- Formulario de Registro -->
        <div class="card">
            <h2>Registrar Asistencia</h2>
            <form id="attendanceForm">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" required>
                        <option value="">Seleccionar estado</option>
                        <option value="presente">✅ Presente</option>
                        <option value="ausente">❌ Ausente</option>
                        <option value="tardanza">⏰ Tardanza</option>
                    </select>
                </div>
                <button type="submit" class="btn">Registrar Asistencia</button>
            </form>
        </div>

        <!-- Resumen Semanal -->
        <div class="card">
            <h2>📊 Resumen Semanal</h2>
            <div class="week-selector" id="weekSelector"></div>
            <div class="stats-grid" id="statsGrid"></div>
            <div style="margin-top: 30px;">
                <label style="margin-bottom: 10px;">Porcentaje de Asistencia General:</label>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
            </div>
        </div>

        <!-- Historial -->
        <div class="card">
            <h2>📝 Historial de Asistencia</h2>
            <div id="historyTable"></div>
            <button class="btn btn-danger" onclick="clearAllData()" style="margin-top: 20px;">
                🗑️ Borrar Todo el Historial
            </button>
        </div>
    </div>

    <script>
        // Inicializar datos
        let attendanceData = JSON.parse(localStorage.getItem('attendanceData')) || [];
        let selectedWeek = 'current';

        // Establecer fecha actual por defecto
        document.getElementById('fecha').valueAsDate = new Date();

        // Función para obtener la semana de una fecha
        function getWeekNumber(date) {
            const d = new Date(date);
            const dayNum = d.getDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        // Función para obtener el rango de fechas de una semana
        function getWeekRange(weekOffset = 0) {
            const now = new Date();
            const currentDay = now.getDay();
            const diff = currentDay === 0 ? 6 : currentDay - 1;
            const monday = new Date(now);
            monday.setDate(now.getDate() - diff + (weekOffset * 7));
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            
            return {
                start: monday.toISOString().split('T')[0],
                end: sunday.toISOString().split('T')[0],
                label: `${monday.toLocaleDateString('es')} - ${sunday.toLocaleDateString('es')}`
            };
        }

        // Renderizar selector de semanas
        function renderWeekSelector() {
            const selector = document.getElementById('weekSelector');
            selector.innerHTML = '';
            
            for (let i = 0; i >= -3; i--) {
                const week = getWeekRange(i);
                const btn = document.createElement('button');
                btn.className = 'week-btn' + (i === 0 ? ' active' : '');
                btn.textContent = i === 0 ? 'Esta Semana' : `Semana ${i === -1 ? 'Pasada' : `-${Math.abs(i)}`}`;
                btn.onclick = () => {
                    selectedWeek = i;
                    document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderWeeklyStats();
                };
                selector.appendChild(btn);
            }
        }

        // Renderizar estadísticas semanales
        function renderWeeklyStats() {
            const week = getWeekRange(selectedWeek);
            const weekData = attendanceData.filter(record => {
                return record.fecha >= week.start && record.fecha <= week.end;
            });

            const total = weekData.length;
            const presentes = weekData.filter(r => r.estado === 'presente').length;
            const ausentes = weekData.filter(r => r.estado === 'ausente').length;
            const tardanzas = weekData.filter(r => r.estado === 'tardanza').length;
            const porcentaje = total > 0 ? Math.round(((presentes + tardanzas) / total) * 100) : 0;

            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${total}</div>
                    <div class="stat-label">Total Registros</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);">
                    <div class="stat-number">${presentes}</div>
                    <div class="stat-label">Presentes</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #e17055 0%, #fdcb6e 100%);">
                    <div class="stat-number">${tardanzas}</div>
                    <div class="stat-label">Tardanzas</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #d63031 0%, #e84393 100%);">
                    <div class="stat-number">${ausentes}</div>
                    <div class="stat-label">Ausentes</div>
                </div>
            `;

            const progressFill = document.getElementById('progressFill');
            progressFill.style.width = porcentaje + '%';
            progressFill.textContent = porcentaje + '%';
        }

        // Renderizar tabla de historial
        function renderHistory() {
            const historyTable = document.getElementById('historyTable');
            
            if (attendanceData.length === 0) {
                historyTable.innerHTML = '<div class="empty-state">No hay registros aún. ¡Comienza registrando asistencia!</div>';
                return;
            }

            const sortedData = [...attendanceData].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            sortedData.forEach((record, index) => {
                const statusClass = `status-${record.estado}`;
                const statusText = record.estado.charAt(0).toUpperCase() + record.estado.slice(1);
                html += `
                    <tr>
                        <td>${record.nombre}</td>
                        <td>${new Date(record.fecha).toLocaleDateString('es')}</td>
                        <td><span class="status ${statusClass}">${statusText}</span></td>
                        <td>
                            <button class="btn btn-danger" onclick="deleteRecord(${index})" style="padding: 5px 15px; font-size: 0.85rem;">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            historyTable.innerHTML = html;
        }

        // Guardar datos en localStorage
        function saveData() {
            localStorage.setItem('attendanceData', JSON.stringify(attendanceData));
        }

        // Eliminar registro
        function deleteRecord(index) {
            if (confirm('¿Estás seguro de eliminar este registro?')) {
                const sortedData = [...attendanceData].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                const recordToDelete = sortedData[index];
                const originalIndex = attendanceData.findIndex(r => 
                    r.nombre === recordToDelete.nombre && 
                    r.fecha === recordToDelete.fecha && 
                    r.estado === recordToDelete.estado
                );
                attendanceData.splice(originalIndex, 1);
                saveData();
                renderAll();
            }
        }

        // Borrar todo el historial
        function clearAllData() {
            if (confirm('¿Estás seguro de borrar TODO el historial? Esta acción no se puede deshacer.')) {
                attendanceData = [];
                saveData();
                renderAll();
            }
        }

        // Manejar envío del formulario
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const fecha = document.getElementById('fecha').value;
            const estado = document.getElementById('estado').value;

            attendanceData.push({ nombre, fecha, estado });
            saveData();
            
            this.reset();
            document.getElementById('fecha').valueAsDate = new Date();
            
            alert('✅ Asistencia registrada correctamente');
            renderAll();
        });

        // Renderizar todo
        function renderAll() {
            renderWeekSelector();
            renderWeeklyStats();
            renderHistory();
        }

        // Inicializar
        renderAll();
    </script>
</body>
</html>
