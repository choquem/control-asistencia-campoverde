<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input[type="file"], input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-success {
            background: #00b894;
        }
        .btn-success:hover {
            background: #00a383;
        }
        .btn-danger {
            background: #e74c3c;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-small {
            padding: 8px 15px;
            font-size: 0.9rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .status-buttons {
            display: flex;
            gap: 5px;
        }
        .status-btn {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .status-btn:hover {
            transform: scale(1.05);
        }
        .status-btn.presente {
            border-color: #00b894;
            color: #00b894;
        }
        .status-btn.presente.active {
            background: #00b894;
            color: white;
        }
        .status-btn.ausente {
            border-color: #e74c3c;
            color: #e74c3c;
        }
        .status-btn.ausente.active {
            background: #e74c3c;
            color: white;
        }
        .status-btn.tardanza {
            border-color: #fdcb6e;
            color: #fdcb6e;
        }
        .status-btn.tardanza.active {
            background: #fdcb6e;
            color: white;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transition: width 0.5s;
        }
        .week-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .week-btn {
            padding: 10px 20px;
            background: #f0f0f0;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .week-btn.active {
            background: #667eea;
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .date-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .current-date {
            font-size: 1.2rem;
            font-weight: 600;
            color: #667eea;
        }
        .student-count {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .csv-format {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
        }
        .csv-format code {
            background: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .card { padding: 20px; }
            table { font-size: 0.85rem; }
            th, td { padding: 8px; }
            .status-buttons { flex-direction: column; }
            .status-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Control de Asistencia</h1>
        
        <!-- Carga de Alumnos -->
        <div class="card">
            <h2>📁 Cargar Lista de Alumnos</h2>
            <div class="form-group">
                <label for="csvFile">Selecciona tu archivo CSV</label>
                <input type="file" id="csvFile" accept=".csv">
                <div class="csv-format">
                    <strong>Formato del CSV:</strong> El archivo debe tener una columna con los nombres.<br>
                    Ejemplo: <code>nombre</code> o <code>Nombre Completo</code><br>
                    El sistema detectará automáticamente la columna de nombres.
                </div>
            </div>
            <div id="studentInfo"></div>
        </div>

        <!-- Control de Asistencia -->
        <div class="card" id="attendanceCard" style="display: none;">
            <h2>✅ Registrar Asistencia</h2>
            <div class="date-display">
                <div>
                    <label for="fecha" style="margin-bottom: 5px;">Fecha:</label>
                    <input type="date" id="fecha" style="width: auto; display: inline-block;">
                </div>
                <div class="current-date" id="currentDate"></div>
                <div class="student-count" id="studentCount"></div>
            </div>
            <div id="attendanceTable"></div>
            <button class="btn btn-success" onclick="saveAttendance()" style="margin-top: 20px;">
                💾 Guardar Asistencia
            </button>
        </div>

        <!-- Resumen Semanal -->
        <div class="card">
            <h2>📊 Resumen Semanal</h2>
            <div class="week-selector" id="weekSelector"></div>
            <div class="stats-grid" id="statsGrid"></div>
            <div style="margin-top: 30px;">
                <label style="margin-bottom: 10px;">Porcentaje de Asistencia General:</label>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
            </div>
        </div>

        <!-- Historial -->
        <div class="card">
            <h2>📝 Historial de Asistencia</h2>
            <div id="historyTable"></div>
            <button class="btn btn-danger" onclick="clearAllData()" style="margin-top: 20px;">
                🗑️ Borrar Todo el Historial
            </button>
        </div>
    </div>

    <script>
        // Variables globales
        let students = JSON.parse(localStorage.getItem('students')) || [];
        let attendanceData = JSON.parse(localStorage.getItem('attendanceData')) || [];
        let selectedWeek = 'current';
        let tempAttendance = {}; // Para guardar asistencia temporal antes de guardar

        // Establecer fecha actual por defecto
        document.getElementById('fecha').valueAsDate = new Date();
        updateCurrentDate();

        // Manejar cambio de fecha
        document.getElementById('fecha').addEventListener('change', function() {
            updateCurrentDate();
            renderAttendanceTable();
        });

        // Actualizar fecha mostrada
        function updateCurrentDate() {
            const fechaInput = document.getElementById('fecha').value;
            const date = new Date(fechaInput + 'T00:00:00');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = date.toLocaleDateString('es', options);
        }

        // Cargar CSV
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                parseCSV(text);
            };
            reader.readAsText(file);
        });

        // Parsear CSV
        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length === 0) {
                alert('El archivo CSV está vacío');
                return;
            }

            // Detectar encabezados
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            
            // Buscar columna de nombres (intentar diferentes nombres comunes)
            let nameColumnIndex = -1;
            const nameKeywords = ['nombre', 'name', 'alumno', 'student', 'nombre completo', 'full name'];
            
            for (let i = 0; i < headers.length; i++) {
                if (nameKeywords.some(keyword => headers[i].includes(keyword))) {
                    nameColumnIndex = i;
                    break;
                }
            }

            // Si no encuentra, usar la primera columna
            if (nameColumnIndex === -1) {
                nameColumnIndex = 0;
            }

            // Extraer nombres
            students = [];
            for (let i = 1; i < lines.length; i++) {
                const columns = lines[i].split(',');
                if (columns[nameColumnIndex]) {
                    const name = columns[nameColumnIndex].trim();
                    if (name && name !== '') {
                        students.push(name);
                    }
                }
            }

            // Guardar en localStorage
            localStorage.setItem('students', JSON.stringify(students));

            // Mostrar información
            document.getElementById('studentInfo').innerHTML = `
                <div style="background: #d4edda; padding: 15px; border-radius: 8px; margin-top: 15px;">
                    ✅ <strong>${students.length} alumnos</strong> cargados correctamente
                </div>
            `;

            // Mostrar sección de asistencia
            document.getElementById('attendanceCard').style.display = 'block';
            document.getElementById('studentCount').textContent = `${students.length} alumnos`;
            
            renderAttendanceTable();
            renderAll();
        }

        // Renderizar tabla de asistencia
        function renderAttendanceTable() {
            const attendanceTable = document.getElementById('attendanceTable');
            const fecha = document.getElementById('fecha').value;

            if (students.length === 0) {
                attendanceTable.innerHTML = '<div class="empty-state">No hay alumnos cargados. Por favor, carga un archivo CSV primero.</div>';
                return;
            }

            // Cargar asistencia existente para esta fecha
            tempAttendance = {};
            const existingRecords = attendanceData.filter(r => r.fecha === fecha);
            existingRecords.forEach(record => {
                tempAttendance[record.nombre] = record.estado;
            });

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>N°</th>
                            <th>Nombre del Alumno</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            students.forEach((student, index) => {
                const currentState = tempAttendance[student] || '';
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${student}</td>
                        <td>
                            <div class="status-buttons">
                                <button class="status-btn presente ${currentState === 'presente' ? 'active' : ''}" 
                                        onclick="setStatus('${student}', 'presente')">
                                    ✅ Presente
                                </button>
                                <button class="status-btn ausente ${currentState === 'ausente' ? 'active' : ''}" 
                                        onclick="setStatus('${student}', 'ausente')">
                                    ❌ Ausente
                                </button>
                                <button class="status-btn tardanza ${currentState === 'tardanza' ? 'active' : ''}" 
                                        onclick="setStatus('${student}', 'tardanza')">
                                    ⏰ Tardanza
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            attendanceTable.innerHTML = html;
        }

        // Establecer estado de un alumno
        function setStatus(student, status) {
            tempAttendance[student] = status;
            renderAttendanceTable();
        }

        // Guardar asistencia
        function saveAttendance() {
            const fecha = document.getElementById('fecha').value;
            
            if (Object.keys(tempAttendance).length === 0) {
                alert('Por favor, marca al menos un alumno');
                return;
            }

            // Eliminar registros anteriores de esta fecha
            attendanceData = attendanceData.filter(r => r.fecha !== fecha);

            // Agregar nuevos registros
            Object.keys(tempAttendance).forEach(student => {
                attendanceData.push({
                    nombre: student,
                    fecha: fecha,
                    estado: tempAttendance[student]
                });
            });

            // Guardar en localStorage
            localStorage.setItem('attendanceData', JSON.stringify(attendanceData));

            alert('✅ Asistencia guardada correctamente');
            renderAll();
        }

        // Función para obtener el rango de fechas de una semana
        function getWeekRange(weekOffset = 0) {
            const now = new Date();
            const currentDay = now.getDay();
            const diff = currentDay === 0 ? 6 : currentDay - 1;
            const monday = new Date(now);
            monday.setDate(now.getDate() - diff + (weekOffset * 7));
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            
            return {
                start: monday.toISOString().split('T')[0],
                end: sunday.toISOString().split('T')[0],
                label: `${monday.toLocaleDateString('es')} - ${sunday.toLocaleDateString('es')}`
            };
        }

        // Renderizar selector de semanas
        function renderWeekSelector() {
            const selector = document.getElementById('weekSelector');
            selector.innerHTML = '';
            
            for (let i = 0; i >= -3; i--) {
                const week = getWeekRange(i);
                const btn = document.createElement('button');
                btn.className = 'week-btn' + (i === 0 ? ' active' : '');
                btn.textContent = i === 0 ? 'Esta Semana' : `Semana ${i === -1 ? 'Pasada' : `-${Math.abs(i)}`}`;
                btn.onclick = () => {
                    selectedWeek = i;
                    document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderWeeklyStats();
                };
                selector.appendChild(btn);
            }
        }

        // Renderizar estadísticas semanales
        function renderWeeklyStats() {
            const week = getWeekRange(selectedWeek);
            const weekData = attendanceData.filter(record => {
                return record.fecha >= week.start && record.fecha <= week.end;
            });

            const total = weekData.length;
            const presentes = weekData.filter(r => r.estado === 'presente').length;
            const ausentes = weekData.filter(r => r.estado === 'ausente').length;
            const tardanzas = weekData.filter(r => r.estado === 'tardanza').length;
            const porcentaje = total > 0 ? Math.round(((presentes + tardanzas) / total) * 100) : 0;

            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${total}</div>
                    <div class="stat-label">Total Registros</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);">
                    <div class="stat-number">${presentes}</div>
                    <div class="stat-label">Presentes</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #e17055 0%, #fdcb6e 100%);">
                    <div class="stat-number">${tardanzas}</div>
                    <div class="stat-label">Tardanzas</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #d63031 0%, #e84393 100%);">
                    <div class="stat-number">${ausentes}</div>
                    <div class="stat-label">Ausentes</div>
                </div>
            `;

            const progressFill = document.getElementById('progressFill');
            progressFill.style.width = porcentaje + '%';
            progressFill.textContent = porcentaje + '%';
        }

        // Renderizar tabla de historial
        function renderHistory() {
            const historyTable = document.getElementById('historyTable');
            
            if (attendanceData.length === 0) {
                historyTable.innerHTML = '<div class="empty-state">No hay registros aún. ¡Comienza registrando asistencia!</div>';
                return;
            }

            const sortedData = [...attendanceData].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            sortedData.forEach((record, index) => {
                const statusClass = `status-${record.estado}`;
                const statusText = record.estado.charAt(0).toUpperCase() + record.estado.slice(1);
                html += `
                    <tr>
                        <td>${record.nombre}</td>
                        <td>${new Date(record.fecha + 'T00:00:00').toLocaleDateString('es')}</td>
                        <td><span class="status ${statusClass}">${statusText}</span></td>
                        <td>
                            <button class="btn btn-danger btn-small" onclick="deleteRecord(${index})">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            historyTable.innerHTML = html;
        }

        // Eliminar registro
        function deleteRecord(index) {
            if (confirm('¿Estás seguro de eliminar este registro?')) {
                const sortedData = [...attendanceData].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                const recordToDelete = sortedData[index];
                const originalIndex = attendanceData.findIndex(r => 
                    r.nombre === recordToDelete.nombre && 
                    r.fecha === recordToDelete.fecha && 
                    r.estado === recordToDelete.estado
                );
                attendanceData.splice(originalIndex, 1);
                localStorage.setItem('attendanceData', JSON.stringify(attendanceData));
                renderAll();
            }
        }

        // Borrar todo el historial
        function clearAllData() {
            if (confirm('¿Estás seguro de borrar TODO el historial? Esta acción no se puede deshacer.')) {
                attendanceData = [];
                localStorage.setItem('attendanceData', JSON.stringify(attendanceData));
                renderAll();
            }
        }

        // Renderizar todo
        function renderAll() {
            renderWeekSelector();
            renderWeeklyStats();
            renderHistory();
        }

        // Inicializar
        if (students.length > 0) {
            document.getElementById('studentInfo').innerHTML = `
                <div style="background: #d4edda; padding: 15px; border-radius: 8px; margin-top: 15px;">
                    ✅ <strong>${students.length} alumnos</strong> cargados
                </div>
            `;
            document.getElementById('attendanceCard').style.display = 'block';
            document.getElementById('studentCount').textContent = `${students.length} alumnos`;
            renderAttendanceTable();
        }
        renderAll();
    </script>
</body>
</html>
