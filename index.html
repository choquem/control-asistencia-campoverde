<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: white; margin-bottom: 30px; font-size: 2.5rem; }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card h2 { color: #667eea; margin-bottom: 20px; font-size: 1.8rem; }
        input[type="date"] {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }
        .btn {
            padding: 12px 30px;
            background: #00b894;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:hover { background: #00a383; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #667eea; color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #e0e0e0; }
        .status-btn {
            padding: 10px 20px;
            border: 3px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin-right: 10px;
        }
        .status-btn.active.presente { background: #00b894; color: white; border-color: #00b894; }
        .status-btn.active.ausente { background: #e74c3c; color: white; border-color: #e74c3c; }
        .status-btn.active.tardanza { background: #fdcb6e; color: white; border-color: #fdcb6e; }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 8px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin: 10px 0; }
        .loading { color: #667eea; font-size: 1.1rem; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Control de Asistencia</h1>
        
        <div class="card">
            <h2>👥 Lista de Alumnos</h2>
            <div id="studentInfo" class="loading">Cargando alumnos...</div>
        </div>

        <div class="card" id="attendanceCard" style="display: none;">
            <h2>✅ Registrar Asistencia</h2>
            <div style="margin-bottom: 20px;">
                <label>Fecha: </label>
                <input type="date" id="fecha">
            </div>
            <div id="attendanceTable"></div>
            <button class="btn" onclick="saveAttendance()">💾 Guardar Asistencia</button>
        </div>
    </div>

    <script>
        let students = [];
        let attendanceData = JSON.parse(localStorage.getItem('attendanceData')) || [];
        let tempAttendance = {};

        document.getElementById('fecha').valueAsDate = new Date();

        // CARGAR CSV DESDE GITHUB
        fetch('https://raw.githubusercontent.com/choquem/mi-primera-pagina/main/students.csv')
            .then(response => {
                if (!response.ok) throw new Error('Error al cargar CSV');
                return response.text();
            })
            .then(text => {
                console.log('CSV cargado:', text);
                const lines = text.split('\n').filter(line => line.trim() !== '');
                students = [];
                for (let i = 1; i < lines.length; i++) {
                    const columns = lines[i].split(',');
                    if (columns.length >= 2) {
                        students.push(columns[1].trim());
                    }
                }
                console.log('Alumnos:', students);
                document.getElementById('studentInfo').innerHTML = `
                    <div class="success">
                        ✅ <strong>${students.length} alumnos</strong> cargados<br>
                        ${students.join(' • ')}
                    </div>
                `;
                document.getElementById('attendanceCard').style.display = 'block';
                renderAttendanceTable();
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('studentInfo').innerHTML = `
                    <div class="error">
                        ❌ Error al cargar: ${error.message}
                    </div>
                `;
            });

        function renderAttendanceTable() {
            const fecha = document.getElementById('fecha').value;
            tempAttendance = {};
            const existingRecords = attendanceData.filter(r => r.fecha === fecha);
            existingRecords.forEach(record => {
                tempAttendance[record.nombre] = record.estado;
            });

            let html = `<table>
                <thead><tr><th>Alumno</th><th>Estado</th></tr></thead>
                <tbody>`;

            students.forEach((student, index) => {
                const currentState = tempAttendance[student] || '';
                html += `<tr>
                    <td><strong>${index + 1}. ${student}</strong></td>
                    <td>
                        <button class="status-btn ${currentState === 'presente' ? 'active presente' : ''}" 
                                onclick="setStatus('${student}', 'presente')">✅ Presente</button>
                        <button class="status-btn ${currentState === 'ausente' ? 'active ausente' : ''}" 
                                onclick="setStatus('${student}', 'ausente')">❌ Ausente</button>
                        <button class="status-btn ${currentState === 'tardanza' ? 'active tardanza' : ''}" 
                                onclick="setStatus('${student}', 'tardanza')">⏰ Tardanza</button>
                    </td>
                </tr>`;
            });

            html += '</tbody></table>';
            document.getElementById('attendanceTable').innerHTML = html;
        }

        function setStatus(student, status) {
            tempAttendance[student] = status;
            renderAttendanceTable();
        }

        function saveAttendance() {
            const fecha = document.getElementById('fecha').value;
            attendanceData = attendanceData.filter(r => r.fecha !== fecha);
            Object.keys(tempAttendance).forEach(student => {
                attendanceData.push({
                    nombre: student,
                    fecha: fecha,
                    estado: tempAttendance[student]
                });
            });
            localStorage.setItem('attendanceData', JSON.stringify(attendanceData));
            alert('✅ Asistencia guardada correctamente');
        }

        document.getElementById('fecha').addEventListener('change', renderAttendanceTable);
    </script>
</body>
</html>
