<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Semanal</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="container">
        <div id="navbar"></div>

        <div class="card">
            <h2>📊 Resumen Semanal</h2>
            <div class="teacher-filters" id="summaryTeacherFilters">
                <label>👨‍🏫 Filtrar por maestro:</label>
                <button class="filter-btn active" onclick="filterSummaryByTeacher('todos')"> Todos</button>
            </div>
            <div class="week-selector" id="weekSelector"></div>
            <div class="week-range" id="weekRange"></div>
            <div class="table-responsive">
            <div id="weeklySummaryTable"></div>
            </div>
            <div class="stats-row" id="statsRow"></div>
            
            <div style="margin-top: 20px;">
                <label style="margin-bottom: 10px; display: block; font-weight: 600;">Porcentaje de Asistencia:</label>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/reporte.js"></script>
</body>
</html>
