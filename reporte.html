<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Semanal</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="container">
        <div id="navbar"></div>

        <div class="card">
            <h2>📊 Resumen Semanal</h2>
            
            <!-- Filtros por maestro -->
            <div class="teacher-filters" id="summaryTeacherFilters">
                <label>👨‍🏫 Filtrar por maestro:</label>
                <button class="filter-btn active" onclick="filterSummaryByTeacher('todos')">📚 Todos</button>
            </div>

            <!-- Filtros por color de asistencia -->
            <div class="teacher-filters" style="margin-top: 15px; border-top: 1px solid #e0e0e0; padding-top: 15px;">
                <label>🎨 Filtrar por asistencia:</label>
                <button class="filter-btn color-filter-btn active" data-color="todos" onclick="filterByAttendanceColor('todos')">
                    📋 Todos
                </button>
                <button class="filter-btn color-filter-btn" data-color="verde" onclick="filterByAttendanceColor('verde')" style="background: #28a745; color: white; border-color: #28a745;">
                    ✅ ≥75%
                </button>
                <button class="filter-btn color-filter-btn" data-color="amarillo" onclick="filterByAttendanceColor('amarillo')" style="background: #ffc107; color: #212529; border-color: #ffc107;">
                    ⚠️ 50-74%
                </button>
                <button class="filter-btn color-filter-btn" data-color="rojo" onclick="filterByAttendanceColor('rojo')" style="background: #dc3545; color: white; border-color: #dc3545;">
                    ❌ &lt;50%
                </button>
            </div>

            <!-- Selector de semanas -->

            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 10px;">
                
                <!-- Botones rápidos (con ancho mínimo reservado para evitar saltos) -->
                <div id="weekSelector" style="display: flex; gap: 5px; min-width: 320px; min-height: 38px; align-items: center;"></div>
                
                <!-- Separador -->
                <div style="width: 1px; height: 30px; background: #ddd; margin: 0 10px;"></div>
                
                <!-- Combo de semanas pasadas -->
                <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
                    <label for="weekCombo" style="font-weight: 600; color: #555; white-space: nowrap;">📅 Semanas anteriores:</label>
                    <select id="weekCombo" onchange="irASemanaEspecifica(this.value)" style="padding: 8px 12px; border: 2px solid #667eea; border-radius: 6px; font-size: 1rem; cursor: pointer; outline: none; flex: 1; max-width: 300px;">
                        <option value="">Cargando semanas...</option>
                    </select>
                </div>
            </div>
            
            <!-- Rango de fechas -->
            <div class="week-range" id="weekRange"></div>
            
            <!-- Tabla de resumen -->
            <div class="table-responsive">
                <div id="weeklySummaryTable"></div>
            </div>
            
            <!-- Estadísticas -->
            <div class="stats-row" id="statsRow"></div>
            
            <!-- Barra de progreso -->
            <div style="margin-top: 20px;">
                <label style="margin-bottom: 10px; display: block; font-weight: 600;">Porcentaje de Asistencia General:</label>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/reporte.js"></script>
</body>
</html>
