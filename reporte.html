<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Semanal</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="container">
        <div id="navbar"></div>

        <div class="card">
            <h2>📊 Resumen Semanal</h2>
            
            <!-- Filtros por maestro -->
            <div class="teacher-filters" id="summaryTeacherFilters">
                <label>👨‍🏫 Filtrar por maestro:</label>
                <button class="filter-btn active" onclick="filterSummaryByTeacher('todos')">📚 Todos</button>
            </div>

            <!-- ✅ NUEVOS: Filtros por color de asistencia -->
            <div class="teacher-filters" style="margin-top: 15px; border-top: 1px solid #e0e0e0; padding-top: 15px;">
                <label>🎨 Filtrar por asistencia:</label>
                <button class="filter-btn color-filter-btn active" data-color="todos" onclick="filterByAttendanceColor('todos')">
                    📋 Todos
                </button>
                <button class="filter-btn color-filter-btn" data-color="verde" onclick="filterByAttendanceColor('verde')" style="background: #28a745; color: white; border-color: #28a745;">
                    ✅ ≥75%
                </button>
                <button class="filter-btn color-filter-btn" data-color="amarillo" onclick="filterByAttendanceColor('amarillo')" style="background: #ffc107; color: #212529; border-color: #ffc107;">
                    ⚠️ 50-74%
                </button>
                <button class="filter-btn color-filter-btn" data-color="rojo" onclick="filterByAttendanceColor('rojo')" style="background: #dc3545; color: white; border-color: #dc3545;">
                    ❌ &lt;50%
                </button>
            </div>

            <div class="week-selector" id="weekSelector"></div>
            <div class="week-range" id="weekRange">
