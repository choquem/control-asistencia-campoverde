<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Asistencia</title>
    <link rel="stylesheet" href="styles/styles.css">
    <style>
        /* Estilos específicos para el combo de semanas */
        .week-select {
            padding: 8px 16px;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            color: #667eea;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            outline: none;
            min-width: 200px;
        }

        .week-select:hover {
            border-color: #764ba2;
            color: #764ba2;
        }

        .week-select:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .week-select option {
            padding: 10px;
            font-weight: 500;
        }

        /* Contenedor de filtros de semana */
        .week-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .week-controls label {
            font-weight: 600;
            margin-right: 8px;
        }

        /* Botón de compensación */
        .compensacion-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white !important;
            border-radius: 6px;
            padding: 6px 12px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .compensacion-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navbar -->
        <div id="navbar"></div>

        <div class="card">
            <h2> Resumen Semanal</h2>
            
            <!-- Filtro por maestro -->
            <div class="filter-section">
                <label>👨🏫 Filtrar por maestro:</label>
                <div id="summaryTeacherFilters">
                    <button class="filter-btn active" onclick="filterSummaryByTeacher('todos')">📚 Todos</button>
                </div>
            </div>

            <!-- Filtro por asistencia -->
            <div class="filter-section">
                <label>🎨 Filtrar por asistencia:</label>
                <div class="color-filters">
                    <button class="color-filter-btn active" data-color="todos" onclick="filterByAttendanceColor('todos')">
                        📋 Todos
                    </button>
                    <button class="color-filter-btn" data-color="verde" onclick="filterByAttendanceColor('verde')">
                        ✅ ≥75%
                    </button>
                    <button class="color-filter-btn" data-color="amarillo" onclick="filterByAttendanceColor('amarillo')">
                        ⚠️ 50-74%
                    </button>
                    <button class="color-filter-btn" data-color="rojo" onclick="filterByAttendanceColor('rojo')">
                        ❌ <50%
                    </button>
                </div>
            </div>

            <!-- Controles de semana: botones + combo -->
            <div class="week-controls">
                <!-- Botones rápidos -->
                <div id="weekSelector" class="week-selector"></div>
                
                <!-- Combo de semanas con datos -->
                <div style="flex: 1; min-width: 200px;">
                    <label for="weekCombo"> Ir a semana:</label>
                    <select id="weekCombo" class="week-select" onchange="jumpToWeek(this.value)">
                        <option value="">Seleccionar semana...</option>
                    </select>
                </div>
            </div>

            <!-- Rango de fechas -->
            <div class="week-range" id="weekRange"></div>

            <!-- Tabla de resumen semanal -->
            <div class="table-responsive">
                <div id="weeklySummaryTable"></div>
            </div>

            <!-- Estadísticas -->
            <h3 style="margin-top: 30px;">Porcentaje de Asistencia General:</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;">0%</div>
            </div>

            <div class="stats-row" id="statsRow"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/reporte.js"></script>
</body>
</html>
